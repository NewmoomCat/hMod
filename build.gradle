plugins {
    id 'java'
}

group 'net.hey0'
version '130'

repositories {
    mavenCentral()
}

dependencies {
    implementation fileTree(dir: 'src/main/resources/lib', includes: ['*.jar'])
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(8)
}

compileJava {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

jar {
    manifest {
        attributes (
            'Class-Path': 'minecraft_server.jar mysql-connector-java-bin.jar plugins/ ',
            'Main-Class': 'Main'
        )
    }
    processResources.exclude("lib")
    processResources.include("version.txt")
    archiveFileName = 'Minecraft_Mod.jar'
}
